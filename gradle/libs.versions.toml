[versions]
# 9.0.1 for the moment. 9.4.1 is available but requires Gradle 9.6.0, and this
# project is on 9.1.0; taking it means a Gradle upgrade in the same change.
# Revisit when something actually needs it -- it is not blocking anything.
androidGradlePlugin = "9.4.1"
androidxCore = "1.18.0"
androidxLifecycle = "2.10.0"
androidxActivity = "1.13.0"
androidxBiometric = "1.1.0"
# BiometricPrompt is hosted by a FragmentActivity, which is the only reason this is
# here. It was a literal version in `app/build.gradle.kts` until `lint` asked for
# the catalog: one dependency declared in two styles is one place to forget when it
# needs raising.
androidxFragment = "1.8.9"
androidxComposeBom = "2026.03.01"
androidxTest = "1.7.0"
androidxTestExt = "1.3.0"
androidxTestRunner = "1.7.0"
androidxTestEspresso = "3.7.0"
coroutines = "1.11.0"
junit = "4.13.2"
kotlin = "2.4.21"
nav3Core = "1.0.1"
lifecycleViewmodelNav3 = "2.10.0"
# LiteRT-LM: Google's on-device LLM runtime.
# Licence: Apache-2.0 (verified; see compliance/allowed-licenses.json).
# Ships arm64-v8a and x86_64 native libraries, so it runs on both a physical
# device and the x86_64 emulator used during development.
litertlm = "0.18.0"

# HTTP client, used only by the model downloader -- the single place in the
# application that touches the network. Apache-2.0.
#
# Chosen over HttpURLConnection for correct redirect handling. Verified against
# the real service: huggingface.co answers a Range request with
# "302 Found" and a Location on cas-bridge.xethub.hf.co, a different host. A
# resumable download depends on the Range header surviving that hop, and
# HttpURLConnection does not reliably re-apply custom headers across it.
# ModelDownloaderTest covers the redirect case.
okhttp = "5.5.0"

# Test-only. MockWebServer is what makes the downloader's awkward cases
# reachable: a server that ignores a Range header, a server that answers 416, a
# file whose checksum does not match. None of those can be provoked against a
# real host on demand, and all of them corrupt a resumed download silently.
# Not on the release classpath, so it is not part of what ships.
mockwebserver = "5.5.0"

# Chat history persistence.
#
# JSON files rather than Room. The serialization compiler plugin is already
# applied to this project, so this costs one runtime dependency and no
# annotation processor; Room would add three dependencies plus KSP. A personal
# chat history is a few dozen conversations, which does not need a query
# planner. ChatStore is an interface, so moving to Room later replaces one
# implementation and touches no callers.
#
# 1.11.0 is the newest stable release; 1.12.0 is still a release candidate.
kotlinxSerialization = "1.11.0"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidxCore" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidxActivity" }
androidx-biometric = { module = "androidx.biometric:biometric", version.ref = "androidxBiometric" }
androidx-fragment-ktx = { module = "androidx.fragment:fragment-ktx", version.ref = "androidxFragment" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "androidxComposeBom" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3"}
androidx-compose-material-icons-core = { group = "androidx.compose.material", name = "material-icons-core" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui"}
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview"}
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4"}
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling"}
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest"}
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidxLifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidxLifecycle" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "androidxLifecycle" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidxTest" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestExt" }
androidx-test-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "androidxTestEspresso" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
junit = { module = "junit:junit", version.ref = "junit" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
androidx-navigation3-runtime = { module = "androidx.navigation3:navigation3-runtime", version.ref = "nav3Core" }
androidx-navigation3-ui = { module = "androidx.navigation3:navigation3-ui", version.ref = "nav3Core" }
androidx-lifecycle-viewmodel-navigation3 = { module = "androidx.lifecycle:lifecycle-viewmodel-navigation3", version.ref = "lifecycleViewmodelNav3" }
litertlm-android = { module = "com.google.ai.edge.litertlm:litertlm-android", version.ref = "litertlm" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
mockwebserver = { module = "com.squareup.okhttp3:mockwebserver3-junit4", version.ref = "mockwebserver" }

[plugins]
android-application = { id = "com.android.application", version.ref = "androidGradlePlugin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }