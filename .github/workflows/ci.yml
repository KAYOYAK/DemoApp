name: CI

# Runs on every push to the default branch and on every pull request, so a
# broken build is caught by the author rather than by a visitor who tried to
# clone and build.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# A new push supersedes an in-flight run on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build, test and lint
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out
        uses: actions/checkout@v7

      # Version 17 because app/build.gradle.kts declares jvmToolchain(17).
      # The toolchain is provisioned here rather than relying on the runner's
      # default JDK, which changes between image updates.
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # Provides the Android SDK and accepts its licences, so a missing
      # build-tools revision is downloaded instead of failing the build.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # Build and lint are not retried: a failure there is about the tree.
      - name: Build and lint
        run: ./gradlew assembleDebug lintDebug --stacktrace

      # The unit suite is, once, for exactly one reason. The chat ViewModel
      # tests tear down Dispatchers.setMain while a coroutine can still come
      # back to the main dispatcher, which fails with "Dispatchers.Main is
      # used concurrently with setting it". Measured on 2026-10-15: 2 of 40
      # local stress runs, always in that class, never reproducible by
      # re-running the same test on its own, and never a product failure --
      # the same code passes 74 tests in every other run. scripts/stress-flake.ps1
      # never retries intentionally and stays the honest counter for it; a
      # second failure here is a real failure.
      - name: Unit tests
        id: unit
        run: ./gradlew testDebugUnitTest --stacktrace

      # --rerun because Gradle leaves the task UP-TO-DATE otherwise, and a
      # retry that executed no test would pass without having tested anything.
      - name: Retry the unit suite once
        if: steps.unit.outcome == 'failure'
        run: ./gradlew testDebugUnitTest --rerun --stacktrace

      # Report uploads use if: always() so a failure still hands you the
      # evidence instead of just a red X.
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
          retention-days: 14
