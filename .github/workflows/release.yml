name: Release

# Triggered by pushing a version tag, e.g.
#   git tag v1.0.0
#   git push origin v1.0.0
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and publish APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # Signing is optional by design.
      #
      # The `fromJSON` of the version-name value is deliberately not used here;
      # the tag is read from the ref. If the four signing secrets are absent the
      # step falls back to a debug build, so the workflow works the first time
      # you run it instead of failing on missing configuration.
      #
      # To enable signed releases add these repository secrets:
      #   KEYSTORE_BASE64      base64 of your .jks  (base64 -w0 release.jks)
      #   KEYSTORE_PASSWORD
      #   KEY_ALIAS
      #   KEY_PASSWORD
      - name: Build release (signed if secrets are present)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            echo "Signing secrets found; building a signed release APK."
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            ./gradlew assembleRelease --stacktrace \
              -Pandroid.injected.signing.store.file="$RUNNER_TEMP/release.jks" \
              -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
              -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
              -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
            cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/app-release.apk"
            echo "APK_PATH=$RUNNER_TEMP/app-release.apk" >> "$GITHUB_ENV"
            echo "APK_KIND=signed release" >> "$GITHUB_ENV"
          else
            echo "No signing secrets configured; falling back to a debug build."
            echo "This APK is debug-signed and is intended for testing only."
            ./gradlew assembleDebug --stacktrace
            cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/app-debug.apk"
            echo "APK_PATH=$RUNNER_TEMP/app-debug.apk" >> "$GITHUB_ENV"
            echo "APK_KIND=debug (unsigned release not configured)" >> "$GITHUB_ENV"
          fi

      - name: Remove keystore from the runner
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      # What the download has to be checked against, and what the app displays.
      #
      # The body below told the reader to verify the download against "the SHA-256
      # published below" while nothing published a SHA-256, and `AppSignature`'s
      # `expected` set makes the same comparison from inside the app -- against a
      # fingerprint that was only ever in a commit message. Both values are
      # computed here, from the artefact that is about to be attached, so the page
      # and the app can be compared by someone holding neither source nor keytool.
      #
      # The certificate digest is printed in the form the About screen prints it:
      # colon-separated upper case. `apksigner` writes it as lower case with no
      # separators, and the two look different enough that a reader comparing them
      # by eye would think they disagree.
      - name: Record the artefact's hash and its signer
        run: |
          set -euo pipefail
          echo "APK_SHA256=$(sha256sum "$APK_PATH" | cut -d' ' -f1)" >> "$GITHUB_ENV"
          APKSIGNER=$(find "${ANDROID_HOME}/build-tools" -name apksigner | sort | tail -1)
          # apksigner names the same digest differently across versions: "Signer #1
          # certificate SHA-256 digest:" in some, "V2 Signer: certificate SHA-256 digest:" in
          # others. Anchoring on the part that cannot move is what keeps this from publishing
          # "(not reported)" for an APK that is signed -- which is what the first release did.
          RAW=$("$APKSIGNER" verify --print-certs "$APK_PATH" |
                sed -n 's/.*certificate SHA-256 digest: //p' | head -1 | tr -d ':')
          if [ -n "$RAW" ]; then
            echo "APK_SIGNER=$(printf '%s' "$RAW" | tr 'a-f' 'A-F' | sed 's/../&:/g; s/:$//')" >> "$GITHUB_ENV"
          else
            echo "APK_SIGNER=(not reported)" >> "$GITHUB_ENV"
          fi

      # The app contains a library that carries copyleft notices, and the decision to
      # ship it (recorded in compliance/embedded-notices.json) is that the notice ships
      # with the artefact. Attaching the file here is that decision's other half: an
      # accepted finding whose notice stayed in the repository would be accepted in name
      # only for anyone downloading the APK.
      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ${{ env.APK_PATH }}
            compliance/notices/litertlm-android-0.18.0-THIRD_PARTY_NOTICE.txt
          generate_release_notes: true
          draft: true
          body: |
            Built from `${{ github.ref_name }}`.

            **Artefact type: ${{ env.APK_KIND }}**

            - APK SHA-256: `${{ env.APK_SHA256 }}`
            - Signing certificate SHA-256: `${{ env.APK_SIGNER }}`

            The APK contains `com.google.ai.edge.litertlm:litertlm-android:0.18.0`, whose
            own `THIRD_PARTY_NOTICE.txt` is attached beside the APK, unchanged. It lists
            the licences of everything the publisher's build touched, including the GPL
            toolchain entries the build environment contributes; what that means here, and
            the evidence behind it, is written down in `compliance/embedded-notices.json`
            in the source.

            Verify the download against the SHA-256 above before installing. The
            app's own About screen prints the certificate this copy is signed with,
            and the check there compares it with the fingerprint recorded in the
            source; on a signed release the line above is that same fingerprint, so
            the two can be compared without either of you running `keytool`.

            Debug-signed builds are for testing only and cannot be published to an
            app store.
