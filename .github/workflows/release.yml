name: Release

# Triggered by pushing a version tag, e.g.
#   git tag v1.0.0
#   git push origin v1.0.0
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and publish APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # Signing is optional by design.
      #
      # The `fromJSON` of the version-name value is deliberately not used here;
      # the tag is read from the ref. If the four signing secrets are absent the
      # step falls back to a debug build, so the workflow works the first time
      # you run it instead of failing on missing configuration.
      #
      # To enable signed releases add these repository secrets:
      #   KEYSTORE_BASE64      base64 of your .jks  (base64 -w0 release.jks)
      #   KEYSTORE_PASSWORD
      #   KEY_ALIAS
      #   KEY_PASSWORD
      - name: Build release (signed if secrets are present)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            echo "Signing secrets found; building a signed release APK."
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            ./gradlew assembleRelease --stacktrace \
              -Pandroid.injected.signing.store.file="$RUNNER_TEMP/release.jks" \
              -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
              -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
              -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
            cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/app-release.apk"
            echo "APK_PATH=$RUNNER_TEMP/app-release.apk" >> "$GITHUB_ENV"
            echo "APK_KIND=signed release" >> "$GITHUB_ENV"
          else
            echo "No signing secrets configured; falling back to a debug build."
            echo "This APK is debug-signed and is intended for testing only."
            ./gradlew assembleDebug --stacktrace
            cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/app-debug.apk"
            echo "APK_PATH=$RUNNER_TEMP/app-debug.apk" >> "$GITHUB_ENV"
            echo "APK_KIND=debug (unsigned release not configured)" >> "$GITHUB_ENV"
          fi

      - name: Remove keystore from the runner
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ env.APK_PATH }}
          generate_release_notes: true
          draft: true
          body: |
            Built from `${{ github.ref_name }}`.

            **Artefact type: ${{ env.APK_KIND }}**

            Verify the download against the SHA-256 published below before
            installing. Debug-signed builds are for testing only and cannot be
            published to an app store.
